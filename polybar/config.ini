;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                      Polybar Config for EVA Unit-01 Rice                  ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;
;;  MULTI-MONITOR SETUP:
;;  ┌─────────────────────────────────────────────────────────────────────┐
;;  │  PRIMARY (HDMI-0):    Full bar - Media, Weather, System, Status     │
;;  │  SECONDARY (DP-0):    Medium - Workspaces, CPU/RAM, KB, Time        │
;;  │  TERTIARY (DP-4):     Minimal - Workspaces, Time only               │
;;  └─────────────────────────────────────────────────────────────────────┘
;;
;;  COLORS:
;;  • Purple (#8A33FF)    - Primary accent (EVA Unit-01)
;;  • Neon Green (#44FF88) - Secondary accent
;;  • Red (#FF5577)       - Warnings/Urgent
;;

[colors]
warn             = #FF5577
warn-hover       = #FF0000
background       = #1C1A25
background-alt   = #2D2A3D
foreground       = #F0F0F0
foreground-alt   = #C8FFF0
purple           = #8A33FF
neon-green       = #44FF88

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                         GLOBAL BAR SETTINGS                               ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/base]
monitor             = ${env:MONITOR}
width               = 100%
height              = 35
radius              = 0
fixed-center        = true
background          = ${colors.background}
foreground          = ${colors.foreground}
font-0              = "Iosevka Nerd Font:size=13;2"
module-margin       = 0
padding-left        = 0
padding-right       = 0
module-margin-left  = 0
module-margin-right = 0
underline-size      = 3
wm-restack          = i3
override-redirect   = false

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                    PRIMARY BAR - Main Display (HDMI-0)                    ;;
;;              Full: Workspaces | Media | System | Status                   ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/primary]
inherit             = bar/base
modules-left        = i3
modules-center      = now-playing visualizer
modules-right       = notifications lan-ip clipboard quick-notes network-speed uptime weather memory temperature volume battery date power tray
tray-position       = right
tray-detached       = false

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                   SECONDARY BAR - Code Display (DP-0)                     ;;
;;              Medium: Workspaces | System | Status                         ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/secondary]
inherit             = bar/base
modules-left        = i3 cpu memory
modules-center      =
modules-right       = xkeyboard network-speed temperature volume date power
tray-position       = none

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                   TERTIARY BAR - Term Display (DP-4)                      ;;
;;              Essential: Workspaces | System | Time                        ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/tertiary]
inherit             = bar/base
modules-left        = i3
modules-center      = dock-terminal dock-browser dock-files dock-code dock-discord dock-spotify dock-settings
modules-right       = uptime temperature volume date
tray-position       = none


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                                 Modules                                   ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                        NEW UTILITY MODULES                                ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/clipboard]
type = custom/script
exec = ~/.config/i3/scripts/clipboard-manager --count
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = ~/.config/i3/scripts/clipboard-manager --select

[module/quick-notes]
type = custom/script
exec = ~/.config/i3/scripts/quick-notes --count
interval = 10
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = ~/.config/i3/scripts/quick-notes --show
click-right = ~/.config/i3/scripts/quick-notes --add

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
format = <label>
label =  %percentage%%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}

[module/pulseaudio-control]
type = custom/text
content = 
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 2
content-underline = ${colors.purple}
click-right = pavucontrol

[module/xkeyboard]
type = custom/script
exec = ~/.config/i3/scripts/keyboard-toggle --show
interval = 2
format = <label>
label = ⌨ %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = ~/.config/i3/scripts/keyboard-toggle --toggle
click-right = ~/.config/i3/scripts/keyboard-toggle --next

[module/applications]
type = custom/text
content = 
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 2
content-underline = ${colors.purple}
click-left = rofi -show drun -config ~/.config/rofi/config.rasi
click-right = thunar

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                         EVA Dock Module                                   ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/dock-terminal]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec alacritty

[module/dock-browser]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec zen-browser

[module/dock-files]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec thunar

[module/dock-code]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec code

[module/dock-discord]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec vesktop

[module/dock-spotify]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec spotify

[module/dock-settings]
type = custom/text
content = " "
content-foreground = ${colors.neon-green}
content-background = ${colors.background-alt}
content-padding = 1
content-underline = ${colors.purple}
click-left = exec xfce4-settings-manager

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates
interval = 600
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = pamac-manager

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                   i3 Workspaces (left of CPU/RAM)                         ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/i3]
type               = internal/i3
pin-workspaces     = true
index-sort         = true

; ── only show workspace “state” (focused/visible/occupied/urgent) ───────
format             = <label-state>

; ── define the four possible “state” labels ──────────────────────────────
label-focused      =  %name%
label-occupied     =  %name%
label-empty        =   %name%
label-urgent       =  %name%

; ── styling to match CPU/RAM pills ───────────────────────────────────────
format-foreground   = ${colors.neon-green}
format-background   = ${colors.background-alt}
format-padding      = 2
format-underline    = ${colors.purple}

[module/cpu]
type               = internal/cpu
interval           = 2
format             = <label>
label              = CPU  %percentage:2:0%%
label-foreground   = ${colors.neon-green}
format-background  = ${colors.background-alt}
format-padding     = 4
format-underline   = ${colors.purple}

[module/memory]
type               = internal/memory
interval           = 3
format             = <label>
label              = RAM   %percentage_used:2%%
label-foreground   = ${colors.neon-green}
format-background  = ${colors.background-alt}
format-padding     = 4
format-underline   = ${colors.purple}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                       Disk Usage (root partition)                        ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/disk]
type                     = internal/fs
mount-0                  = /
interval                 = 30

; ── Mounted state ──────────────────────────────────────────────────────────
format-mounted           = <label-mounted>
label-mounted            =    %percentage_used%%
label-mounted-foreground = ${colors.neon-green}
format-mounted-background= ${colors.background-alt}
format-mounted-padding   = 4
format-mounted-underline = ${colors.purple}

; ── Unmounted state ───────────────────────────────────────────────────────
format-unmounted         = <label-unmounted>
label-unmounted          = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground}
format-unmounted-background= ${colors.background-alt}
format-unmounted-padding   = 4
format-unmounted-underline = ${colors.purple}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                     CPU Temperature (thermal zone 0)                     ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/temperature]
type               = internal/temperature
thermal-zone       = 0
hwmon-path         = /sys/class/hwmon/hwmon2/temp1_input
base-temp          = 45
warn-temp          = 70
format             = <label>
format-warn        = <label-warn>
label              =  %temperature-c%
label-warn         =  %temperature-c%
label-warn-foreground = ${colors.warn}
label-foreground   = ${colors.neon-green}
format-background  = ${colors.background-alt}
format-padding     = 2
format-underline   = ${colors.purple}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;            Network (WLAN) – state‐specific labels, no <label> tag      ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/wlan]
type                   = internal/network
interface-type         = wireless
interval               = 3

; ── Connected ─────────────────────────────────────────────────────────────
format-connected       = <label-connected>
label-connected        = ↓ %downspeed% ↑ %upspeed%
label-connected-foreground  = ${colors.neon-green}
label-connected-background  = ${colors.background-alt}
label-connected-padding     = 4
label-connected-underline   = ${colors.purple}

; ── Disconnected ──────────────────────────────────────────────────────────
format-disconnected    = <label-disconnected>
label-disconnected     = %ifname% down
label-disconnected-foreground = ${colors.foreground-alt}
label-disconnected-background = ${colors.background-alt}
label-disconnected-padding    = 4
label-disconnected-underline  = ${colors.purple}

[module/volume]
type                       = internal/pulseaudio
interval                   = 5

format-volume              = <label-volume>
label-volume               =   %percentage%%
format-volume-foreground   = ${colors.neon-green}
format-volume-background   = ${colors.background-alt}
format-volume-padding      = 4
format-volume-underline    = ${colors.purple}

format-muted               = <label-muted>
label-muted                =  muted
format-muted-foreground    = ${colors.neon-green}
format-muted-background    = ${colors.background-alt}
format-muted-padding       = 4
format-muted-underline     = ${colors.purple}

[module/battery]
type                       = internal/battery
battery                    = BAT0
adapter                    = AC
interval                   = 30

format-charging            = <label-charging>
label-charging             =  %percentage%%
format-charging-foreground = ${colors.neon-green}
format-charging-background = ${colors.background-alt}
format-charging-padding    = 4
format-charging-underline  = ${colors.purple}

format-discharging         = <label-discharging>
label-discharging          =  %percentage%%
format-discharging-foreground= ${colors.neon-green}
format-discharging-background= ${colors.background-alt}
format-discharging-padding   = 4
format-discharging-underline = ${colors.purple}

format-full                = <label-full>
label-full                 =   100%
format-full-foreground     = ${colors.neon-green}
format-full-background     = ${colors.background-alt}
format-full-padding        = 4
format-full-underline      = ${colors.purple}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                    Date & Time – must specify date/time keys             ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/date]
type                   = internal/date
interval               = 1

; ── what to show ──────────────────────────────────────────────────────────
date                   = %Y-%m-%d
time                   = %H:%M:%S
; optional toggle formats
date-alt               = %A, %d %B %Y
time-alt               = %I:%M:%S %p

; ── styling ────────────────────────────────────────────────────────────────
format                 = <label>
label                  = %date%  %time%
label-foreground       = ${colors.neon-green}
label-background       = ${colors.background-alt}
label-padding          = 4
label-underline        = ${colors.purple}

; ── click actions ─────────────────────────────────────────────────────────
click-left             = gsimplecal
click-right            = gnome-calendar

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                         Weather Module (wttr.in)                          ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/weather]
type = custom/script
exec = ~/.config/i3/scripts/weather-wttr
interval = 900
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = wttr.in/Pola-de-Siero

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                      Network Speed Module                                 ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/network-speed]
type = custom/script
exec = ~/.config/i3/scripts/network-speed
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                         Uptime Module                                     ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/uptime]
type = custom/script
exec = ~/.config/i3/scripts/uptime-widget
interval = 10
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = uptime

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                         Calendar Module                                   ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/calendar]
type = custom/script
exec = ~/.config/i3/scripts/calendar-widget
interval = 60
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = gsimplecal
click-right = gnome-calendar


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                          Power (shutdown) module                          ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/power]
type               = custom/text
format             = <label>
label              =   OFF

; ── warning pill styling ────────────────────────────────────────────────────
format-foreground  = ${colors.foreground}
format-background  = ${colors.warn}
format-padding     = 2
format-underline   = ${colors.warn}

; ── hover (requires a Polybar build with PR #2868) ──────────────────────────
format-hover-background  = ${colors.warn-hover}
format-hover-underline   = ${colors.warn-hover}

; ── click action ────────────────────────────────────────────────────────────
click-left         = systemctl poweroff

[module/spacer]
type               = custom/text
format             = <label>
label              =
format-foreground  = ${colors.neon-green}
format-background  = ${colors.background-alt}
format-padding     = 30
format-underline   = ${colors.purple}


[module/sep]
type = custom/text
content = |
content-foreground = ${colors.purple}
content-background = ${colors.background-alt}
content-padding = 1

[module/eth]
type                   = internal/network
interface              = eth0
interval               = 3

format-connected       = <label-connected>
label-connected        =   %local_ip%
label-connected-foreground  = ${colors.neon-green}
label-connected-background  = ${colors.background-alt}
label-connected-padding     = 2
label-connected-underline   = ${colors.purple}

format-disconnected      = <label-disconnected>
label-disconnected       =   down
label-disconnected-foreground = ${colors.foreground-alt}
label-disconnected-background = ${colors.background-alt}
label-disconnected-padding    = 2
label-disconnected-underline  = ${colors.purple}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                      LAN IP Address Module                                ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/lan-ip]
type = custom/script
exec = ~/.config/i3/scripts/lan-ip
interval = 10
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = ~/.config/i3/scripts/lan-ip --copy

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                      Notification Count Module (Dunst)                    ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/notifications]
type = custom/script
exec = ~/.config/i3/scripts/notification-count
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.neon-green}
format-background = ${colors.background-alt}
format-padding = 2
format-underline = ${colors.purple}
click-left = dunstctl history-pop
click-right = dunstctl clear-all

[module/visualizer]
type = custom/script
exec = ~/.config/polybar/scripts/polybar-cava.sh
tail = true
format = <label>
format-font = 5
format-background = ${colors.purple}
format-foreground = ${colors.neon-green}
format-padding = 6
format-underline = ${colors.neon-green}

[module/now-playing]
type = custom/script
tail = true
format = <label>
exec = ~/.config/polybar/scripts/polybar-now-playing/polybar-now-playing
format-font = 5
format-background = ${colors.purple}
format-foreground = ${colors.neon-green}
format-padding = 3
format-underline = ${colors.neon-green}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                       System Tray (always last)                         ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/tray]
type               = internal/tray

; ─── pill background & padding ───────────────────────────────────────────
tray-background    = ${colors.background-alt}
tray-padding       = 4

; ─── control icon size & offset for perfect centering ────────────────────
tray-maxsize       = 20
tray-offset-x      = 0
tray-offset-y      = 2

[settings]
screenchange-reload = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                           MODULES REFERENCE                               ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;
;;  AVAILABLE MODULES:
;;  ─────────────────
;;  • i3              - Workspace buttons
;;  • cpu             - CPU usage percentage
;;  • memory          - RAM usage percentage
;;  • disk            - Root partition usage
;;  • temperature     - CPU temperature
;;  • wlan            - WiFi speed/status
;;  • eth             - Ethernet IP status
;;  • lan-ip          - LAN IP address display
;;  • notifications   - Dunst notification count
;;  • volume          - Audio volume
;;  • pulseaudio-control - Quick audio control
;;  • battery         - Battery percentage
;;  • date            - Date and time (click for calendar)
;;  • weather         - Current weather - Pola de Siero (wttr.in)
;;  • network-speed   - Real-time network speed
;;  • uptime          - System uptime
;;  • calendar        - Date/time with events
;;  • clipboard       - Clipboard history manager
;;  • quick-notes     - Quick notes widget
;;  • xkeyboard       - Keyboard layout indicator
;;  • updates         - System updates counter
;;  • applications    - App launcher button
;;  • power           - Shutdown button
;;  • now-playing     - Media player status
;;  • visualizer      - Audio visualizer (CAVA)
;;  • tray            - System tray icons
;;  • spacer          - Wide spacer
;;  • sep             - Separator (|)
;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;                              END OF CONFIG                                ;;
;;                          EVA UNIT-01 INITIALIZED                          ;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
