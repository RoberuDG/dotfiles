# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                    EVA UNIT-01 PICOM OPTIMIZED CONFIG                         ║
# ║      Focused window opaque, unfocused transparent (videos visible)            ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

backend = "glx"
vsync = true
use-damage = false

# Shadows
shadow = true
shadow-radius = 7
shadow-opacity = 0.6
shadow-offset-x = -7
shadow-offset-y = -7

# Faster fade animations
fading = true
fade-in-step = 0.05
fade-out-step = 0.05
fade-delta = 10

# Corner radius
corner-radius = 6

# ═══════════════════════════════════════════════════════════════════════════════
# TRANSPARENCY - Focused opaque, unfocused shows videos
# ═══════════════════════════════════════════════════════════════════════════════

# Active window (focused) - FULLY OPAQUE (no transparency)
active-opacity = 1.0

# Inactive windows - transparent so videos show through
inactive-opacity = 0.75

# Window frame/border opacity
frame-opacity = 0.70

# Specific app opacity for UNFOCUSED windows only
opacity-rule = [
    "75:class_g = 'Alacritty' && !focused",
    "75:class_g = 'Kitty' && !focused",
    "75:class_g = 'Ghostty' && !focused",
    "80:class_g = 'google-chrome' && !focused",
    "80:class_g = 'zen-browser' && !focused",
    "80:class_g = 'Firefox' && !focused",
    "80:class_g = 'Brave-browser' && !focused",
    "78:class_g = 'Thunar' && !focused",
    "80:class_g = 'Code' && !focused",
    "80:class_g = 'Cursor' && !focused",
    "100:class_g = 'mpv'"
];

# Window type opacity
wintypes:
{
    tooltip = { fade = false; shadow = false; opacity = 0.85; focus-exclude = true; };
    dock = { shadow = false; opacity = 0.90; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.92; };
    dropdown_menu = { opacity = 0.92; };
    desktop = { shadow = false; fade = false; focus-exclude = true; };
    dialog = { opacity = 0.90; };
    utility = { opacity = 0.85; };
    toolbar = { opacity = 0.85; };
    menu = { opacity = 0.90; };
};
